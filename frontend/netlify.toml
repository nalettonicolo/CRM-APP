# Next.js su Netlify — cartella frontend del monorepo
# Nel pannello Netlify imposta anche:
#   Base directory: frontend
#   Build command: npm run build   (eseguito dentro frontend/)
#   Publish: gestito da @netlify/plugin-nextjs

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
