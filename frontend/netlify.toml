# Netlify usa questo file quando "Package directory" = frontend.
# NON eseguire `npm run build` dalla root (compilerebbe anche il backend).
# Publish = dove Next scrive `.next` nel monorepo (non la root repo `.next`).
# Se nel sito Netlify c'è ancora "Publish directory" = `.next`, cancellalo:
# questo valore nel TOML deve prevalere.

[build]
  # --no-audit/--no-fund: evita round-trip npm in CI; dipendenze già validate in lockfile.
  # --prefer-offline: usa la dependency cache di Netlify quando disponibile.
  # NODE_ENV=production solo in build (non in npm ci), altrimenti manca @tailwindcss/postcss
  command = "npm ci --prefer-offline --no-audit --no-fund && NODE_ENV=production npm run build --workspace=crm-frontend"
  publish = "frontend/.next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # Opzionale: meno verbosità npm
  NPM_CONFIG_PROGRESS = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
