# Netlify usa questo file quando "Package directory" = frontend.
# NON eseguire `npm run build` dalla root (compilerebbe anche il backend).

[build]
  command = "npm ci && npm run build --workspace=crm-frontend"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
