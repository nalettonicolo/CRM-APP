# Copia su Mint: ~/.cloudflared/config.yml
# Sostituisci <UUID> con l'ID del tunnel (file ~/.cloudflared/<UUID>.json)
#
# ─── Deploy autonomo (consigliato): un dominio → frontend Next.js :3000 ───
# L'API Express (:4100) è raggiunta via proxy Next (/api, /uploads).
# Configura prima: backend/scripts/configura-dominio-mint.sh https://www.tuodominio.it

tunnel: crm-nicolo-service
credentials-file: /home/nicolo/.cloudflared/<UUID>.json

ingress:
  - hostname: www.tuodominio.it
    service: http://127.0.0.1:3000
  - hostname: tuodominio.it
    service: http://127.0.0.1:3000
  - service: http_status:404

# ─── Alternativa: due hostname (API separata, cookie cross-site) ───
# Richiede TRUST_CROSS_SITE_COOKIES=true nel backend/.env
# NEXT_PUBLIC_API_URL=https://api.tuodominio.it (senza proxy Next)
#
# ingress:
#   - hostname: www.tuodominio.it
#     service: http://127.0.0.1:3000
#   - hostname: api.tuodominio.it
#     service: http://127.0.0.1:4100
#   - service: http_status:404
